<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allergen form</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../dist/css/allergens.min.css">
</head>
<body>
  <div class="container p-4">

    <div class="row">
      <div class="col">
        <h1>Allergens</h1>
      </div>
      <div class="col-auto text-end">
        <strong>EN</strong>
        <span class="text-body-secondary">·</span>
        <a href="forms.nl.html" class="link-body-emphasis">NL</a>
      </div>
    </div>

    <br />

    <form class="container" method="POST">

      <div class="card">

        <ul class="list-group list-group-flush">
          <li class="list-group-item">
            <input class="form-check-input allergen-gluten me-2" type="checkbox" id="allergenCheckGluten">
            <label class="form-check-label stretched-link" for="allergenCheckGluten">Cereals containing gluten</label>
          </li>
          <li class="list-group-item">
            <input class="form-check-input allergen-crustaceans me-2" type="checkbox" id="allergenCheckCrustaceans">
            <label class="form-check-label stretched-link" for="allergenCheckCrustaceans">Crustaceans</label>
          </li>
          <li class="list-group-item">
            <input class="form-check-input allergen-eggs me-2" type="checkbox" id="allergenCheckEggs">
            <label class="form-check-label stretched-link" for="allergenCheckEggs">Eggs</label>
          </li>
          <li class="list-group-item">
            <input class="form-check-input allergen-fish me-2" type="checkbox" id="allergenCheckFish">
            <label class="form-check-label stretched-link" for="allergenCheckFish">Fish</label>
          </li>
          <li class="list-group-item">
            <input class="form-check-input allergen-peanuts me-2" type="checkbox" id="allergenCheckPeanuts">
            <label class="form-check-label stretched-link" for="allergenCheckPeanuts">Peanuts</label>
          </li>
          <li class="list-group-item">
            <input class="form-check-input allergen-soybeans me-2" type="checkbox" id="allergenCheckSoybeans">
            <label class="form-check-label stretched-link" for="allergenCheckSoybeans">Soybeans</label>
          </li>
          <li class="list-group-item">
            <input class="form-check-input allergen-milk me-2" type="checkbox" id="allergenCheckMilk">
            <label class="form-check-label stretched-link" for="allergenCheckMilk">Milk</label>
          </li>
          <li class="list-group-item">
            <input class="form-check-input allergen-nuts me-2" type="checkbox" id="allergenCheckNuts">
            <label class="form-check-label stretched-link" for="allergenCheckNuts">Nuts</label>
          </li>
          <li class="list-group-item">
            <input class="form-check-input allergen-celery me-2" type="checkbox" id="allergenCheckCelery">
            <label class="form-check-label stretched-link" for="allergenCheckCelery">Celery</label>
          </li>
          <li class="list-group-item">
            <input class="form-check-input allergen-mustard me-2" type="checkbox" id="allergenCheckMustard">
            <label class="form-check-label stretched-link" for="allergenCheckMustard">Mustard</label>
          </li>
          <li class="list-group-item">
            <input class="form-check-input allergen-sesame me-2" type="checkbox" id="allergenCheckSesame">
            <label class="form-check-label stretched-link" for="allergenCheckSesame">Sesame seeds</label>
          </li>
          <li class="list-group-item">
            <input class="form-check-input allergen-sulphites me-2" type="checkbox" id="allergenCheckSulphites">
            <label class="form-check-label stretched-link" for="allergenCheckSulphites">Sulphur dioxide and sulphites</label>
          </li>
          <li class="list-group-item">
            <input class="form-check-input allergen-lupin me-2" type="checkbox" id="allergenCheckLupin">
            <label class="form-check-label stretched-link" for="allergenCheckLupin">Lupin</label>
          </li>
          <li class="list-group-item">
            <input class="form-check-input allergen-molluscs me-2" type="checkbox" id="allergenCheckMolluscs">
            <label class="form-check-label stretched-link" for="allergenCheckMolluscs">Molluscs</label>
          </li>
        </ul>

      </div>

    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha256-ew8UiV1pJH/YjpOEBInP1HxVvT/SfrCmwSoUzF9JIgc=" crossorigin="anonymous"></script>
</body>
</html>
